name: AI Knowledge Layer & CI Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint & TypeScript Checks
        run: npm run lint

      - name: Generate Component Knowledge Catalog
        run: npm run generate:catalog

      - name: Commit Updated Catalog Artifact (Main Only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ai-schema): auto-update component catalog [skip ci]"
          file_pattern: "docs/component-catalog.json"